# Expected schema for the H3 hexagon GeoJSON (city-hex-polygons-8-10.geojson,
# filtered to a single resolution). Consumed by src/conformance.py.
#
# Score = (1 - dataset_weight) * mean(per-feature weighted rule pass rate)
#       +      dataset_weight  * (weighted dataset rule pass rate)
# Every rule gives partial credit, so one bad feature lowers the score a little
# instead of flipping the whole dataset to "fail".
version: 1

thresholds:
  # score >= pass_at  -> PASS
  # score >= warn_at  -> WARN (logged, pipeline continues)
  # otherwise         -> FAIL (pipeline raises)
  pass_at: 0.99
  warn_at: 0.95

dataset_weight: 0.2

dataset_rules:
  - check: collection_type
    weight: 1
    params: {expected: FeatureCollection}
  - check: crs_name
    weight: 1
    params: {expected: "urn:ogc:def:crs:OGC:1.3:CRS84"}
  # Sanity band for the number of res 8 hexagons covering the City.
  - check: feature_count_between
    weight: 2
    params: {min: 3500, max: 4200}
  - check: unique_property
    weight: 3
    params: {property: index}

feature_rules:
  - check: is_feature
    weight: 1
  - check: index_format
    weight: 2
    params: {pattern: "^8[0-9a-f]{14}$"}   # 15 hex chars, mode 1 H3 cell
  - check: index_resolution
    weight: 3
    params: {expected: 8}                  # decoded from the H3 bit layout
  - check: resolution_property
    weight: 2
    params: {expected: 8}
  - check: centroid_in_bbox
    weight: 2
    params: {lat: [-34.5, -33.3], lon: [18.2, 19.2]}
  - check: geometry_is_polygon
    weight: 2
  - check: ring_closed
    weight: 1
  - check: ring_vertex_count
    weight: 1
    params: {expected: 7}                  # 6 corners + closing vertex
  - check: coords_in_bbox
    weight: 2
    params: {lat: [-34.5, -33.3], lon: [18.2, 19.2]}
  - check: centroid_inside_polygon_bbox
    weight: 2
